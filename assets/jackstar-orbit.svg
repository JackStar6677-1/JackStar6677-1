<svg width="100%" height="auto" viewBox="0 0 1400 580" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JackStar — Systems Architect, StarSuites Creator &amp; Autonomous SRE</title>
  <desc id="desc">Celestial obsidian, amethyst, cosmic gold, and neon cyan sovereign architecture banner for JackStar.</desc>

  <defs>
    <!-- Gradientes Cósmicos Profundos -->
    <linearGradient id="spaceVoid" x1="0" y1="0" x2="1400" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030107"/>
      <stop offset="18%" stop-color="#0D041E"/>
      <stop offset="50%" stop-color="#080D26"/>
      <stop offset="82%" stop-color="#140628"/>
      <stop offset="100%" stop-color="#02040D"/>
    </linearGradient>

    <!-- Aurora y Nebulosas Centrales -->
    <radialGradient id="auroraCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 290) rotate(90) scale(400 860)">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.30"/>
      <stop offset="28%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030107" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaNova" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 180) scale(280)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#030107" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaNexus" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 380) scale(300)">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#030107" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente de Texto Principal JackStar -->
    <linearGradient id="jackTitleGrad" x1="380" y1="190" x2="1020" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="22%" stop-color="#FDE68A"/>
      <stop offset="52%" stop-color="#C084FC"/>
      <stop offset="82%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Gradientes de Órbitas y Acentos -->
    <linearGradient id="orbitGold" x1="160" y1="290" x2="1240" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="28%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#A855F7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="panelBorder" x1="280" y1="130" x2="1120" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="panelBackdrop" x1="300" y1="140" x2="1100" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#120724" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#080F26" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#050A1A" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Malla Reticular Holográfica -->
    <pattern id="matrixGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.8"/>
      <circle cx="48" cy="48" r="0.9" fill="#A855F7" fill-opacity="0.2"/>
    </pattern>

    <!-- Filtros de Resplandor Óptico -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starFlare" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animaciones CSS Puras -->
    <style>
      .mono-fnt { font-family: "JetBrains Mono", "Fira Code", monospace; }
      .sans-fnt { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

      @keyframes spinClockwise { to { transform: rotate(360deg); } }
      @keyframes spinCounter { to { transform: rotate(-360deg); } }
      @keyframes dashFlow { to { stroke-dashoffset: -160; } }
      @keyframes dashFlowRev { to { stroke-dashoffset: 160; } }
      @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.25); } }
      @keyframes laserScan { 0%, 100% { transform: translateX(-360px); opacity: 0; } 20%, 80% { opacity: 0.8; } 50% { transform: translateX(360px); } }
      @keyframes starBeat { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #F59E0B); } 50% { transform: scale(1.12); filter: drop-shadow(0 0 18px #A855F7); } }

      .orbit-outer { transform-origin: 700px 290px; animation: spinClockwise 90s linear infinite; }
      .orbit-mid { transform-origin: 700px 290px; animation: spinCounter 60s linear infinite; }
      .orbit-inner { transform-origin: 700px 290px; animation: spinClockwise 38s linear infinite; }
      .dash-active { stroke-dasharray: 14 18; animation: dashFlow 12s linear infinite; }
      .dash-active-rev { stroke-dasharray: 8 16; animation: dashFlowRev 16s linear infinite; }
      .card-floating { animation: floatCard 6s ease-in-out infinite; }
      .core-pulsing { animation: pulseGlow 4s ease-in-out infinite; transform-origin: 700px 290px; }
      .star-sparkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .scanner-beam { animation: laserScan 6s ease-in-out infinite; }
      .sovereign-star { animation: starBeat 3.2s ease-in-out infinite; transform-origin: 700px 175px; }
    </style>
  </defs>

  <!-- Fondo del Cosmos -->
  <rect width="1400" height="580" rx="30" fill="url(#spaceVoid)"/>
  <rect x="16" y="16" width="1368" height="548" rx="24" fill="url(#matrixGrid)"/>

  <!-- Nebulosas Espaciales -->
  <ellipse cx="700" cy="290" rx="660" ry="260" fill="url(#auroraCore)" filter="url(#softGlow)"/>
  <circle cx="220" cy="180" r="240" fill="url(#nebulaNova)" filter="url(#softGlow)"/>
  <circle cx="1180" cy="390" r="260" fill="url(#nebulaNexus)" filter="url(#softGlow)"/>

  <!-- Guías de Alineación Geométrica del Clúster (Nova · Star · Nexus) -->
  <g opacity="0.4">
    <path d="M 80 80 L 1320 80 M 80 500 L 1320 500" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <path d="M 160 60 V 520 M 1240 60 V 520" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <!-- Vínculos Tripartitos del Clúster -->
    <line x1="220" y1="180" x2="700" y2="290" stroke="#38BDF8" stroke-opacity="0.22" stroke-dasharray="6 6"/>
    <line x1="700" y1="290" x2="1180" y2="390" stroke="#EC4899" stroke-opacity="0.22" stroke-dasharray="6 6"/>
  </g>

  <!-- Sistema de Anillos Orbitales Centrales -->
  <!-- Órbita Exterior C (Nexus Link) -->
  <g class="orbit-outer" opacity="0.55">
    <ellipse cx="700" cy="290" rx="660" ry="210" stroke="#A78BFA" stroke-width="1.2" class="dash-active-rev"/>
    <circle cx="1360" cy="290" r="4.5" fill="#38BDF8" filter="url(#starFlare)"/>
    <circle cx="40" cy="290" r="3.5" fill="#F59E0B" filter="url(#starFlare)"/>
  </g>

  <!-- Órbita Media B (Star Ring) -->
  <g class="orbit-mid" opacity="0.75">
    <ellipse cx="700" cy="290" rx="540" ry="165" stroke="url(#orbitGold)" stroke-width="1.8" class="dash-active"/>
    <circle class="core-pulsing" cx="1240" cy="290" r="5.5" fill="#FDE68A" filter="url(#starFlare)"/>
    <circle cx="160" cy="290" r="4.5" fill="#C084FC" filter="url(#starFlare)"/>
  </g>

  <!-- Órbita Interior A (Nova Dev Core) -->
  <g class="orbit-inner" opacity="0.88">
    <ellipse cx="700" cy="290" rx="410" ry="125" stroke="#38BDF8" stroke-width="1.4" stroke-dasharray="10 12"/>
    <circle cx="1110" cy="290" r="5" fill="#06B6D4" filter="url(#starFlare)"/>
    <circle cx="290" cy="290" r="4" fill="#F43F5E" filter="url(#starFlare)"/>
  </g>

  <!-- Panel Central de Sistemas (Glassmorphism Ampliado sin Desbordamientos) -->
  <g filter="url(#laserGlow)">
    <rect x="270" y="130" width="860" height="320" rx="26" fill="url(#panelBackdrop)" stroke="url(#panelBorder)" stroke-width="1.8"/>
    <rect x="285" y="145" width="830" height="290" rx="20" fill="#040714" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <!-- Escáner Láser de Telemetría -->
    <line class="scanner-beam" x1="700" y1="145" x2="700" y2="435" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2.5"/>
  </g>

  <!-- Emblema de la Estrella Soberana (JackStar Core) -->
  <g class="sovereign-star">
    <path d="M 700 148 L 707 170 L 729 176 L 707 182 L 700 204 L 693 182 L 671 176 L 693 170 Z" fill="#FDE68A" filter="url(#starFlare)"/>
    <circle cx="700" cy="176" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Tipografía Principal: JACKSTAR -->
  <g text-anchor="middle">
    <text class="sans-fnt" x="700" y="260" fill="url(#jackTitleGrad)" font-size="82" font-weight="900" letter-spacing="6" filter="url(#laserGlow)">
      JACKSTAR
    </text>

    <!-- Subtítulo de Autoría y Sistemas (Con espacio holgado) -->
    <text class="sans-fnt" x="700" y="302" fill="#FDE68A" font-size="16" font-weight="800" letter-spacing="3.2">
      SYSTEMS ARCHITECT · STARSUITES CREATOR · SRE ORCHESTRATION
    </text>

    <!-- Línea Divisoria Celestial -->
    <line x1="360" y1="328" x2="1040" y2="328" stroke="url(#panelBorder)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="700" cy="328" r="3.5" fill="#F59E0B"/>

    <!-- Píldoras de Especialidad Técnica (Holgura horizontal total) -->
    <text class="mono-fnt" x="700" y="360" fill="#E2E8F0" font-size="13" font-weight="700" letter-spacing="1.2">
      JAVA 21 LTS · RUST SIMD FFM · SQLITE WAL · CLOUD &amp; CAMPUS NETWORKS
    </text>

    <!-- Barra de Estado Activo y Clúster -->
    <g transform="translate(700, 398)">
      <rect x="-260" y="-14" width="520" height="28" rx="8" fill="#0A1329" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="-236" cy="0" r="4.5" fill="#22C55E"/>
      <text class="mono-fnt" x="0" y="4" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="1">
        CLUSTER: STAR-VPS [24/7] · NOVA [WORKSTATION] · NEXUS [GPU]
      </text>
    </g>
  </g>

  <!-- 4 Nodos Satélites Flotantes (Los Tres Pilares + Infraestructura) -->
  <g class="card-floating">
    <!-- Nodo 1: Tecnología Institucional (Pilar 1 - Genérico, Privacidad Estricta) -->
    <g transform="translate(130, 210)" filter="url(#starFlare)">
      <rect x="-85" y="-32" width="170" height="64" rx="16" fill="#0B132B" fill-opacity="0.94" stroke="#38BDF8" stroke-width="1.3"/>
      <circle cx="-62" cy="-4" r="5" fill="#38BDF8"/>
      <text class="sans-fnt" text-anchor="middle" x="12" y="-7" fill="#E0F2FE" font-size="12" font-weight="800">Campus Tech</text>
      <text class="mono-fnt" text-anchor="middle" x="12" y="13" fill="#7DD3FC" font-size="9.5">education &amp; labs</text>
    </g>

    <!-- Nodo 2: Star Engine & StarSuites (Pilar 2) -->
    <g transform="translate(1270, 210)" filter="url(#starFlare)">
      <rect x="-95" y="-32" width="190" height="64" rx="16" fill="#1A0B2E" fill-opacity="0.94" stroke="#C084FC" stroke-width="1.3"/>
      <circle cx="-70" cy="-4" r="5" fill="#A855F7"/>
      <text class="sans-fnt" text-anchor="middle" x="10" y="-7" fill="#F3E8FF" font-size="12" font-weight="800">StarSuites Monorepo</text>
      <text class="mono-fnt" text-anchor="middle" x="10" y="13" fill="#D8B4FE" font-size="9.5">8 suites + rust ffm</text>
    </g>

    <!-- Nodo 3: SAORI SRE Autonomous Fleet -->
    <g transform="translate(170, 435)" filter="url(#starFlare)">
      <rect x="-90" y="-32" width="180" height="64" rx="16" fill="#1C1024" fill-opacity="0.94" stroke="#F472B6" stroke-width="1.3"/>
      <circle cx="-66" cy="-4" r="5" fill="#F43F5E"/>
      <text class="sans-fnt" text-anchor="middle" x="12" y="-7" fill="#FDF2F8" font-size="12" font-weight="800">SAORI Framework</text>
      <text class="mono-fnt" text-anchor="middle" x="12" y="13" fill="#F472B6" font-size="9.5">autonomous sre triad</text>
    </g>

    <!-- Nodo 4: DrakesCraft Network (Pilar 3) -->
    <g transform="translate(1230, 435)" filter="url(#starFlare)">
      <rect x="-95" y="-32" width="190" height="64" rx="16" fill="#1F1607" fill-opacity="0.94" stroke="#F59E0B" stroke-width="1.3"/>
      <circle cx="-70" cy="-4" r="5" fill="#FBBF24"/>
      <text class="sans-fnt" text-anchor="middle" x="10" y="-7" fill="#FEF3C7" font-size="12" font-weight="800">DrakesCraft Network</text>
      <text class="mono-fnt" text-anchor="middle" x="10" y="13" fill="#FCD34D" font-size="9.5">dallas tx production</text>
    </g>
  </g>

  <!-- Constelación y Campo de Estrellas Parpadeantes -->
  <g class="star-sparkle">
    <circle cx="100" cy="80" r="2" fill="#BAE6FD"/>
    <circle cx="280" cy="70" r="2.5" fill="#FDE68A"/>
    <circle cx="340" cy="115" r="1.8" fill="#DDD6FE"/>
    <circle cx="510" cy="65" r="2.2" fill="#BAE6FD"/>
    <circle cx="890" cy="75" r="2.4" fill="#FDE68A"/>
    <circle cx="1060" cy="60" r="2" fill="#DDD6FE"/>
    <circle cx="1310" cy="90" r="2.6" fill="#FDE68A"/>
    <circle cx="110" cy="270" r="2.2" fill="#BAE6FD"/>
    <circle cx="1290" cy="260" r="2.5" fill="#FDE68A"/>
    <circle cx="250" cy="520" r="2" fill="#DDD6FE"/>
    <circle cx="610" cy="530" r="2.4" fill="#BAE6FD"/>
    <circle cx="820" cy="525" r="2.2" fill="#FDE68A"/>
    <circle cx="1090" cy="515" r="2" fill="#DDD6FE"/>
    <circle cx="1260" cy="520" r="2.4" fill="#BAE6FD"/>
  </g>

  <!-- Borde Exterior con Resplandor Cósmico -->
  <rect x="2" y="2" width="1396" height="576" rx="28" fill="none" stroke="url(#panelBorder)" stroke-width="2.5" opacity="0.8"/>
  <rect x="8" y="8" width="1384" height="564" rx="22" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.3"/>
</svg>
