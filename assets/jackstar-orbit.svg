<svg width="1400" height="480" viewBox="0 0 1400 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JackStar profile banner</title>
  <desc id="desc">Elegant purple and gold animated banner with orbital lines, subtle coffee cup and system details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090111"/>
      <stop offset="0.38" stop-color="#24083F"/>
      <stop offset="0.7" stop-color="#11112F"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 230) rotate(90) scale(240 520)">
      <stop stop-color="#8B5CF6" stop-opacity="0.62"/>
      <stop offset="0.48" stop-color="#D4A24A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#090111" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 330) rotate(30) scale(250 160)">
      <stop stop-color="#D4A24A" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#090111" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 170) rotate(40) scale(260 170)">
      <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="210" y1="65" x2="1190" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.45" stop-color="#D4A24A"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="glass" x1="142" y1="98" x2="382" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="blur20" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="titleGlow" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FDE68A" flood-opacity="0.62"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#8B5CF6" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
    <style>
      .mono { font-family: "Fira Code", "Cascadia Code", Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .spin { transform-origin: 700px 240px; animation: spin 42s linear infinite; }
      .spinBack { transform-origin: 700px 240px; animation: spinBack 64s linear infinite; }
      .float { animation: float 5.6s ease-in-out infinite; }
      .steam { animation: steam 3.6s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      .dash { stroke-dasharray: 10 16; animation: dash 11s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinBack { to { transform: rotate(-360deg); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 34% { opacity: .75; } 100% { opacity: 0; transform: translateY(-24px); } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes blink { 0%,48%,100% { opacity: 1; } 58%,82% { opacity: .28; } }
      @keyframes dash { to { stroke-dashoffset: -96; } }
    </style>
  </defs>

  <rect width="1400" height="480" rx="38" fill="url(#bg)"/>
  <ellipse cx="700" cy="230" rx="540" ry="270" fill="url(#core)" filter="url(#blur20)"/>
  <ellipse cx="250" cy="330" rx="250" ry="160" fill="url(#leftGlow)" filter="url(#blur20)"/>
  <ellipse cx="1120" cy="170" rx="260" ry="170" fill="url(#rightGlow)" filter="url(#blur20)"/>

  <g opacity="0.14">
    <path d="M96 110H1304M96 240H1304M96 370H1304" stroke="#FFFFFF"/>
    <path d="M214 72V408M392 72V408M570 72V408M748 72V408M926 72V408M1104 72V408" stroke="#FFFFFF"/>
  </g>

  <g class="spinBack" opacity="0.64">
    <ellipse cx="700" cy="240" rx="520" ry="136" stroke="url(#orbit)" stroke-width="1.2" class="dash"/>
    <circle class="pulse" cx="1220" cy="240" r="5" fill="#FDE68A"/>
    <circle cx="180" cy="240" r="4" fill="#A78BFA"/>
  </g>
  <g class="spin" opacity="0.72">
    <ellipse cx="700" cy="240" rx="360" ry="94" stroke="#D4A24A" stroke-width="1.35" stroke-opacity="0.72"/>
    <circle class="pulse" cx="1060" cy="240" r="5" fill="#D4A24A"/>
    <circle cx="340" cy="240" r="4" fill="#C084FC"/>
  </g>

  <g opacity="0.55">
    <path d="M1020 318L1090 274L1170 294L1250 232" stroke="#D4A24A" stroke-opacity="0.45"/>
    <path d="M180 150L265 118L350 158L430 124" stroke="#A78BFA" stroke-opacity="0.38"/>
    <circle cx="180" cy="150" r="3" fill="#FDE68A"/>
    <circle cx="265" cy="118" r="3.5" fill="#C084FC"/>
    <circle cx="350" cy="158" r="3" fill="#FDE68A"/>
    <circle cx="430" cy="124" r="3" fill="#C084FC"/>
    <circle cx="1090" cy="274" r="3.5" fill="#FDE68A"/>
    <circle cx="1250" cy="232" r="3.5" fill="#FDE68A"/>
  </g>

  <g transform="translate(116 88)" filter="url(#softShadow)">
    <rect width="250" height="58" rx="14" fill="url(#glass)" stroke="#D4A24A" stroke-opacity="0.28"/>
    <text class="mono" x="22" y="36" fill="#FDE68A" font-size="16" font-weight="700">systems online</text>
    <circle class="blink" cx="214" cy="29" r="5" fill="#22C55E"/>
  </g>

  <g class="float" transform="translate(170 306)" filter="url(#softShadow)">
    <rect width="250" height="72" rx="16" fill="url(#glass)" stroke="#8B5CF6" stroke-opacity="0.34"/>
    <text class="mono" x="20" y="30" fill="#E9D5FF" font-size="14">terminal</text>
    <text class="mono" x="20" y="54" fill="#FDE68A" font-size="14">$ deploy --rollback</text>
  </g>

  <g class="float" transform="translate(1102 302)" filter="url(#softShadow)">
    <ellipse cx="62" cy="92" rx="80" ry="16" fill="#000000" fill-opacity="0.22"/>
    <rect x="26" y="32" width="78" height="64" rx="15" fill="#261432" stroke="#D4A24A" stroke-opacity="0.58"/>
    <path d="M104 48h18c22 0 22 34 0 34h-18" stroke="#D4A24A" stroke-width="8" stroke-linecap="round"/>
    <path d="M40 48h50" stroke="#FDE68A" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>
    <path class="steam" d="M48 20c-10-18 16-20 6-38" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
    <path class="steam" d="M70 18c-10-20 18-22 7-41" stroke="#C084FC" stroke-width="4" stroke-linecap="round" style="animation-delay:.55s"/>
    <path class="steam" d="M90 21c-9-17 15-20 6-36" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" style="animation-delay:1.1s"/>
  </g>

  <g transform="translate(700 200)" text-anchor="middle" filter="url(#titleGlow)">
    <text class="sans" y="0" fill="#FFF7D6" font-size="76" font-weight="850">JackStar</text>
    <text class="mono" y="44" fill="#D4A24A" font-size="18" font-weight="700">ingenieria · sistemas vivos · automatizacion · infraestructura</text>
    <text class="mono" y="76" fill="#D8B4FE" font-size="15">Castel · DrakesCraft · CCAACalendar · tooling real</text>
  </g>

  <g transform="translate(996 92)" filter="url(#softShadow)">
    <rect width="280" height="54" rx="14" fill="url(#glass)" stroke="#8B5CF6" stroke-opacity="0.34"/>
    <text class="mono" x="22" y="34" fill="#E9D5FF" font-size="15" font-weight="700">coffee driven ops</text>
  </g>

  <g opacity="0.9">
    <circle cx="520" cy="92" r="3" fill="#FDE68A"/>
    <circle cx="880" cy="104" r="3" fill="#C084FC"/>
    <circle cx="1090" cy="186" r="3" fill="#FDE68A"/>
    <circle cx="272" cy="262" r="2.6" fill="#C084FC"/>
    <circle cx="778" cy="342" r="3" fill="#FDE68A"/>
    <circle cx="1268" cy="358" r="2.6" fill="#C084FC"/>
  </g>
</svg>
