<svg width="100%" height="auto" viewBox="0 0 1400 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JackStar — Systems Architect &amp; StarSuites Creator</title>
  <desc id="desc">Animated celestial obsidian, violet, gold and neon cyan systems banner for JackStar, featuring orbital kinematics, StarSuites architecture, and autonomous SRE orchestration.</desc>

  <defs>
    <!-- Gradientes Cósmicos Profundos -->
    <linearGradient id="spaceVoid" x1="0" y1="0" x2="1400" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040209"/>
      <stop offset="22%" stop-color="#120626"/>
      <stop offset="50%" stop-color="#090E2A"/>
      <stop offset="78%" stop-color="#1A0933"/>
      <stop offset="100%" stop-color="#030511"/>
    </linearGradient>

    <!-- Aurora y Nebulosas Centrales -->
    <radialGradient id="auroraCore" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 240) rotate(90) scale(340 760)">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32"/>
      <stop offset="26%" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#040209" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaNova" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 160) scale(260)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#040209" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaNexus" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 320) scale(280)">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#040209" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente de Texto Principal JackStar -->
    <linearGradient id="jackTitleGrad" x1="400" y1="170" x2="1000" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#C084FC"/>
      <stop offset="85%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Gradientes de Órbitas y Acentos -->
    <linearGradient id="orbitGold" x1="180" y1="240" x2="1220" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="panelBorder" x1="380" y1="110" x2="1020" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="panelBackdrop" x1="420" y1="120" x2="980" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#130826" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0A1128" stop-opacity="0.93"/>
      <stop offset="100%" stop-color="#070C1E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Malla Reticular Holográfica -->
    <pattern id="matrixGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="0.8"/>
      <circle cx="48" cy="48" r="0.9" fill="#A855F7" fill-opacity="0.2"/>
    </pattern>

    <!-- Filtros de Resplandor Óptico -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="laserGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starFlare" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animaciones CSS Puras -->
    <style>
      .mono-fnt { font-family: "JetBrains Mono", "Fira Code", monospace; }
      .sans-fnt { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

      @keyframes spinClockwise { to { transform: rotate(360deg); } }
      @keyframes spinCounter { to { transform: rotate(-360deg); } }
      @keyframes dashFlow { to { stroke-dashoffset: -160; } }
      @keyframes dashFlowRev { to { stroke-dashoffset: 160; } }
      @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.25); } }
      @keyframes laserScan { 0%, 100% { transform: translateX(-220px); opacity: 0; } 20%, 80% { opacity: 0.8; } 50% { transform: translateX(220px); } }
      @keyframes starBeat { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #F59E0B); } 50% { transform: scale(1.12); filter: drop-shadow(0 0 18px #A855F7); } }

      .orbit-outer { transform-origin: 700px 240px; animation: spinClockwise 85s linear infinite; }
      .orbit-mid { transform-origin: 700px 240px; animation: spinCounter 55s linear infinite; }
      .orbit-inner { transform-origin: 700px 240px; animation: spinClockwise 35s linear infinite; }
      .dash-active { stroke-dasharray: 14 18; animation: dashFlow 12s linear infinite; }
      .dash-active-rev { stroke-dasharray: 8 16; animation: dashFlowRev 16s linear infinite; }
      .card-floating { animation: floatCard 6s ease-in-out infinite; }
      .core-pulsing { animation: pulseGlow 4s ease-in-out infinite; transform-origin: 700px 240px; }
      .star-sparkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .scanner-beam { animation: laserScan 6s ease-in-out infinite; }
      .sovereign-star { animation: starBeat 3.2s ease-in-out infinite; transform-origin: 700px 148px; }
    </style>
  </defs>

  <!-- Fondo del Cosmos -->
  <rect width="1400" height="480" rx="28" fill="url(#spaceVoid)"/>
  <rect x="16" y="16" width="1368" height="448" rx="22" fill="url(#matrixGrid)"/>

  <!-- Nebulosas Espaciales -->
  <ellipse cx="700" cy="240" rx="640" ry="240" fill="url(#auroraCore)" filter="url(#softGlow)"/>
  <circle cx="240" cy="160" r="220" fill="url(#nebulaNova)" filter="url(#softGlow)"/>
  <circle cx="1160" cy="320" r="240" fill="url(#nebulaNexus)" filter="url(#softGlow)"/>

  <!-- Guías de Alineación Geométrica del Clúster (Nova · Star · Nexus) -->
  <g opacity="0.4">
    <path d="M 120 70 L 1280 70 M 120 410 L 1280 410" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    <path d="M 180 50 V 430 M 1220 50 V 430" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <!-- Vínculos Tripartitos del Clúster -->
    <line x1="240" y1="160" x2="700" y2="240" stroke="#38BDF8" stroke-opacity="0.25" stroke-dasharray="6 6"/>
    <line x1="700" y1="240" x2="1160" y2="320" stroke="#EC4899" stroke-opacity="0.25" stroke-dasharray="6 6"/>
  </g>

  <!-- Sistema de Anillos Orbitales Centrales -->
  <!-- Órbita Exterior C (Nexus Link) -->
  <g class="orbit-outer" opacity="0.55">
    <ellipse cx="700" cy="240" rx="630" ry="180" stroke="#A78BFA" stroke-width="1.2" class="dash-active-rev"/>
    <circle cx="1330" cy="240" r="4.5" fill="#38BDF8" filter="url(#starFlare)"/>
    <circle cx="70" cy="240" r="3.5" fill="#F59E0B" filter="url(#starFlare)"/>
  </g>

  <!-- Órbita Media B (Star Ring) -->
  <g class="orbit-mid" opacity="0.75">
    <ellipse cx="700" cy="240" rx="510" ry="140" stroke="url(#orbitGold)" stroke-width="1.8" class="dash-active"/>
    <circle class="core-pulsing" cx="1210" cy="240" r="5.5" fill="#FDE68A" filter="url(#starFlare)"/>
    <circle cx="190" cy="240" r="4.5" fill="#C084FC" filter="url(#starFlare)"/>
  </g>

  <!-- Órbita Interior A (Nova Dev Core) -->
  <g class="orbit-inner" opacity="0.88">
    <ellipse cx="700" cy="240" rx="370" ry="105" stroke="#38BDF8" stroke-width="1.4" stroke-dasharray="10 12"/>
    <circle cx="1070" cy="240" r="5" fill="#06B6D4" filter="url(#starFlare)"/>
    <circle cx="330" cy="240" r="4" fill="#F43F5E" filter="url(#starFlare)"/>
  </g>

  <!-- Panel Central de Sistemas (Glassmorphism Cyberpunk) -->
  <g filter="url(#laserGlow)">
    <rect x="375" y="105" width="650" height="270" rx="24" fill="url(#panelBackdrop)" stroke="url(#panelBorder)" stroke-width="1.6"/>
    <rect x="390" y="120" width="620" height="240" rx="18" fill="#040714" fill-opacity="0.38" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <!-- Escáner Láser de Telemetría -->
    <line class="scanner-beam" x1="700" y1="120" x2="700" y2="360" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2.5"/>
  </g>

  <!-- Emblema de la Estrella Soberana (JackStar Core) -->
  <g class="sovereign-star">
    <path d="M 700 120 L 706 142 L 728 148 L 706 154 L 700 176 L 694 154 L 672 148 L 694 142 Z" fill="#FDE68A" filter="url(#starFlare)"/>
    <circle cx="700" cy="148" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Tipografía Principal: JACKSTAR -->
  <g text-anchor="middle">
    <text class="sans-fnt" x="700" y="235" fill="url(#jackTitleGrad)" font-size="82" font-weight="900" letter-spacing="6" filter="url(#laserGlow)">
      JACKSTAR
    </text>

    <!-- Subtítulo de Autoría y Sistemas -->
    <text class="sans-fnt" x="700" y="274" fill="#FDE68A" font-size="15.5" font-weight="800" letter-spacing="4.5">
      SYSTEMS ARCHITECT · STARSUITES CREATOR · SRE ORCHESTRATION
    </text>

    <!-- Línea Divisoria Celestial -->
    <line x1="450" y1="295" x2="950" y2="295" stroke="url(#panelBorder)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="700" cy="295" r="3" fill="#F59E0B"/>

    <!-- Píldoras de Especialidad Técnica -->
    <text class="mono-fnt" x="700" y="325" fill="#E2E8F0" font-size="12.5" font-weight="700" letter-spacing="1.5">
      JAVA 21 LTS · RUST SIMD FFM · SQLITE WAL · CLOUD &amp; CAMPUS NETWORKS
    </text>
  </g>

  <!-- 4 Nodos Satélites Flotantes (Los Tres Pilares + Infraestructura) -->
  <g class="card-floating">
    <!-- Nodo 1: Tecnología Institucional (Pilar 1 - Genérico, Privacidad Estricta) -->
    <g transform="translate(160, 160)" filter="url(#starFlare)">
      <rect x="-85" y="-30" width="170" height="60" rx="16" fill="#0B132B" fill-opacity="0.94" stroke="#38BDF8" stroke-width="1.3"/>
      <circle cx="-62" cy="-2" r="5" fill="#38BDF8"/>
      <text class="sans-fnt" text-anchor="middle" x="12" y="-5" fill="#E0F2FE" font-size="12" font-weight="800">Campus Tech</text>
      <text class="mono-fnt" text-anchor="middle" x="12" y="14" fill="#7DD3FC" font-size="9.5">education &amp; labs</text>
    </g>

    <!-- Nodo 2: Star Engine & StarSuites (Pilar 2) -->
    <g transform="translate(1240, 160)" filter="url(#starFlare)">
      <rect x="-90" y="-30" width="180" height="60" rx="16" fill="#1A0B2E" fill-opacity="0.94" stroke="#C084FC" stroke-width="1.3"/>
      <circle cx="-66" cy="-2" r="5" fill="#A855F7"/>
      <text class="sans-fnt" text-anchor="middle" x="12" y="-5" fill="#F3E8FF" font-size="12" font-weight="800">StarSuites Monorepo</text>
      <text class="mono-fnt" text-anchor="middle" x="12" y="14" fill="#D8B4FE" font-size="9.5">8 suites + rust ffm</text>
    </g>

    <!-- Nodo 3: SAORI SRE Autonomous Fleet -->
    <g transform="translate(200, 345)" filter="url(#starFlare)">
      <rect x="-90" y="-30" width="180" height="60" rx="16" fill="#1C1024" fill-opacity="0.94" stroke="#F472B6" stroke-width="1.3"/>
      <circle cx="-66" cy="-2" r="5" fill="#F43F5E"/>
      <text class="sans-fnt" text-anchor="middle" x="12" y="-5" fill="#FDF2F8" font-size="12" font-weight="800">SAORI Framework</text>
      <text class="mono-fnt" text-anchor="middle" x="12" y="14" fill="#F472B6" font-size="9.5">autonomous sre triad</text>
    </g>

    <!-- Nodo 4: DrakesCraft Network (Pilar 3) -->
    <g transform="translate(1200, 345)" filter="url(#starFlare)">
      <rect x="-90" y="-30" width="180" height="60" rx="16" fill="#1F1607" fill-opacity="0.94" stroke="#F59E0B" stroke-width="1.3"/>
      <circle cx="-66" cy="-2" r="5" fill="#FBBF24"/>
      <text class="sans-fnt" text-anchor="middle" x="12" y="-5" fill="#FEF3C7" font-size="12" font-weight="800">DrakesCraft Network</text>
      <text class="mono-fnt" text-anchor="middle" x="12" y="14" fill="#FCD34D" font-size="9.5">dallas tx production</text>
    </g>
  </g>

  <!-- Constelación y Campo de Estrellas Parpadeantes -->
  <g class="star-sparkle">
    <circle cx="100" cy="80" r="2" fill="#BAE6FD"/>
    <circle cx="280" cy="70" r="2.5" fill="#FDE68A"/>
    <circle cx="340" cy="115" r="1.8" fill="#DDD6FE"/>
    <circle cx="510" cy="65" r="2.2" fill="#BAE6FD"/>
    <circle cx="890" cy="75" r="2.4" fill="#FDE68A"/>
    <circle cx="1060" cy="60" r="2" fill="#DDD6FE"/>
    <circle cx="1310" cy="90" r="2.6" fill="#FDE68A"/>
    <circle cx="110" cy="270" r="2.2" fill="#BAE6FD"/>
    <circle cx="1290" cy="260" r="2.5" fill="#FDE68A"/>
    <circle cx="270" cy="420" r="2" fill="#DDD6FE"/>
    <circle cx="610" cy="430" r="2.4" fill="#BAE6FD"/>
    <circle cx="820" cy="425" r="2.2" fill="#FDE68A"/>
    <circle cx="1090" cy="415" r="2" fill="#DDD6FE"/>
    <circle cx="1260" cy="420" r="2.4" fill="#BAE6FD"/>
  </g>

  <!-- Borde Exterior con Resplandor Cósmico -->
  <rect x="2" y="2" width="1396" height="476" rx="26" fill="none" stroke="url(#panelBorder)" stroke-width="2.5" opacity="0.75"/>
  <rect x="8" y="8" width="1384" height="464" rx="20" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.3"/>
</svg>
