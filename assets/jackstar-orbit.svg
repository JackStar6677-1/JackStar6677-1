<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JackStar profile orbit</title>
  <desc id="desc">Purple and gold animated profile banner with system, web and ops nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12051F"/>
      <stop offset="0.48" stop-color="#2B0E4E"/>
      <stop offset="1" stop-color="#0E1028"/>
    </linearGradient>
    <linearGradient id="gold" x1="221" y1="42" x2="974" y2="328" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE6A3"/>
      <stop offset="0.45" stop-color="#D4A24A"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 180) rotate(90) scale(205 460)">
      <stop stop-color="#7C3AED" stop-opacity="0.62"/>
      <stop offset="0.58" stop-color="#D4A24A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#12051F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#D4A24A" flood-opacity="0.42"/>
    </filter>
    <style>
      .mono { font-family: "Fira Code", "Cascadia Code", Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .orbit { transform-origin: 600px 180px; animation: spin 22s linear infinite; }
      .orbit-slow { transform-origin: 600px 180px; animation: spinReverse 32s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .blink { animation: blink 1.4s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinReverse { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%,100% { opacity: .55; r: 4; } 50% { opacity: 1; r: 7; } }
      @keyframes blink { 0%,42%,100% { opacity: 1; } 50%,88% { opacity: .25; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <ellipse cx="600" cy="180" rx="470" ry="205" fill="url(#glow)" filter="url(#soft)"/>

  <g opacity="0.32">
    <path d="M86 72H1114" stroke="#D4A24A" stroke-opacity="0.28"/>
    <path d="M86 288H1114" stroke="#8B5CF6" stroke-opacity="0.24"/>
    <path d="M152 36V324" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M1048 36V324" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>

  <g class="orbit-slow" opacity="0.78">
    <ellipse cx="600" cy="180" rx="400" ry="116" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="9 12"/>
    <circle class="pulse" cx="1000" cy="180" r="5" fill="#FFE6A3"/>
    <circle cx="200" cy="180" r="4" fill="#8B5CF6"/>
  </g>

  <g class="orbit" opacity="0.9">
    <ellipse cx="600" cy="180" rx="314" ry="88" stroke="#D4A24A" stroke-width="1.4" stroke-opacity="0.72"/>
    <circle class="pulse" cx="914" cy="180" r="5" fill="#D4A24A"/>
    <circle cx="286" cy="180" r="4" fill="#C084FC"/>
  </g>

  <g transform="translate(96 84)">
    <rect x="0" y="0" width="218" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#D4A24A" stroke-opacity="0.35"/>
    <text class="mono" x="18" y="27" fill="#FDE68A" font-size="16">systems online</text>
    <circle class="blink" cx="194" cy="21" r="5" fill="#22C55E"/>
  </g>

  <g transform="translate(896 234)">
    <rect x="0" y="0" width="214" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <text class="mono" x="18" y="27" fill="#E9D5FF" font-size="16">ops with rollback</text>
  </g>

  <g transform="translate(600 177)" text-anchor="middle" filter="url(#textGlow)">
    <text class="sans" y="-28" fill="#FFF7D6" font-size="62" font-weight="800" letter-spacing="0">JackStar</text>
    <text class="mono" y="20" fill="#D4A24A" font-size="18">web institucional · Minecraft ops · automatizacion local</text>
    <text class="mono" y="54" fill="#D8B4FE" font-size="15">Castel · DrakesCraft · CCAACalendar · tooling real</text>
  </g>

  <g opacity="0.78">
    <circle cx="390" cy="92" r="3" fill="#FDE68A"/>
    <circle cx="802" cy="78" r="3" fill="#C084FC"/>
    <circle cx="1008" cy="112" r="2.5" fill="#FDE68A"/>
    <circle cx="228" cy="268" r="2.5" fill="#C084FC"/>
    <circle cx="774" cy="298" r="3" fill="#FDE68A"/>
  </g>
</svg>
