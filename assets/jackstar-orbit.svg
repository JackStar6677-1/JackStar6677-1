<svg width="1400" height="480" viewBox="0 0 1400 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JackStar profile banner</title>
  <desc id="desc">Purple and gold animated orbital banner for JackStar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080113"/>
      <stop offset="0.35" stop-color="#250742"/>
      <stop offset="0.7" stop-color="#101132"/>
      <stop offset="1" stop-color="#050817"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 230) rotate(90) scale(250 560)">
      <stop stop-color="#8B5CF6" stop-opacity="0.58"/>
      <stop offset="0.52" stop-color="#D4A24A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#080113" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(285 340) rotate(15) scale(360 210)">
      <stop stop-color="#D4A24A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#080113" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 155) rotate(20) scale(330 210)">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#050817" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldOrbit" x1="218" y1="76" x2="1186" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.42" stop-color="#D4A24A"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="blur20" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="titleGlow" x="-30%" y="-70%" width="160%" height="240%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FDE68A" flood-opacity="0.62"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#8B5CF6" flood-opacity="0.32"/>
    </filter>
    <style>
      .mono { font-family: "Fira Code", "Cascadia Code", Consolas, monospace; }
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .spinA { transform-origin: 700px 240px; animation: spin 46s linear infinite; }
      .spinB { transform-origin: 700px 240px; animation: spinBack 70s linear infinite; }
      .spinC { transform-origin: 700px 240px; animation: spin 92s linear infinite; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .twinkle { animation: twinkle 2.7s ease-in-out infinite; }
      .dash { stroke-dasharray: 10 16; animation: dash 12s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinBack { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes dash { to { stroke-dashoffset: -112; } }
    </style>
  </defs>

  <rect width="1400" height="480" rx="38" fill="url(#bg)"/>
  <ellipse cx="700" cy="230" rx="540" ry="270" fill="url(#core)" filter="url(#blur20)"/>
  <ellipse cx="285" cy="340" rx="360" ry="210" fill="url(#leftGlow)" filter="url(#blur20)"/>
  <ellipse cx="1060" cy="155" rx="330" ry="210" fill="url(#rightGlow)" filter="url(#blur20)"/>

  <g opacity="0.12">
    <path d="M100 118H1300M100 250H1300M100 382H1300" stroke="#FFFFFF"/>
    <path d="M212 76V404M386 76V404M560 76V404M734 76V404M908 76V404M1082 76V404" stroke="#FFFFFF"/>
  </g>

  <g class="spinB" opacity="0.58">
    <ellipse cx="700" cy="240" rx="520" ry="136" stroke="url(#goldOrbit)" stroke-width="1.2" class="dash"/>
    <circle class="pulse" cx="1220" cy="240" r="5" fill="#FDE68A"/>
    <circle cx="180" cy="240" r="4" fill="#A78BFA"/>
  </g>
  <g class="spinA" opacity="0.64">
    <ellipse cx="700" cy="240" rx="372" ry="98" stroke="#D4A24A" stroke-width="1.35" stroke-opacity="0.72"/>
    <circle class="pulse" cx="1072" cy="240" r="5" fill="#D4A24A"/>
    <circle cx="328" cy="240" r="4" fill="#C084FC"/>
  </g>
  <g class="spinC" opacity="0.28">
    <ellipse cx="700" cy="240" rx="620" ry="176" stroke="#C4B5FD" stroke-width="1" stroke-dasharray="6 18"/>
  </g>

  <g opacity="0.58">
    <path d="M176 154L268 116L354 160L442 126" stroke="#A78BFA" stroke-opacity="0.4"/>
    <path d="M994 326L1084 276L1178 298L1250 232" stroke="#D4A24A" stroke-opacity="0.42"/>
    <circle class="twinkle" cx="176" cy="154" r="3" fill="#FDE68A"/>
    <circle class="twinkle" cx="268" cy="116" r="3.5" fill="#C084FC" style="animation-delay:.35s"/>
    <circle class="twinkle" cx="354" cy="160" r="3" fill="#FDE68A" style="animation-delay:.7s"/>
    <circle class="twinkle" cx="442" cy="126" r="3" fill="#C084FC" style="animation-delay:1.05s"/>
    <circle class="twinkle" cx="1084" cy="276" r="3.5" fill="#FDE68A" style="animation-delay:.5s"/>
    <circle class="twinkle" cx="1250" cy="232" r="3.5" fill="#FDE68A" style="animation-delay:1.2s"/>
  </g>

  <g transform="translate(700 204)" text-anchor="middle" filter="url(#titleGlow)">
    <text class="sans" y="0" fill="#FFF7D6" font-size="80" font-weight="850">JackStar</text>
    <text class="mono" y="48" fill="#D4A24A" font-size="18" font-weight="700">ingenieria · sistemas vivos · automatizacion · infraestructura</text>
    <text class="mono" y="80" fill="#D8B4FE" font-size="15">Castel · DrakesCraft · CCAACalendar · tooling real</text>
  </g>

  <g opacity="0.88">
    <circle class="twinkle" cx="520" cy="92" r="3" fill="#FDE68A"/>
    <circle class="twinkle" cx="882" cy="104" r="3" fill="#C084FC" style="animation-delay:.45s"/>
    <circle class="twinkle" cx="1094" cy="188" r="3" fill="#FDE68A" style="animation-delay:.9s"/>
    <circle class="twinkle" cx="272" cy="262" r="2.6" fill="#C084FC" style="animation-delay:1.3s"/>
    <circle class="twinkle" cx="778" cy="342" r="3" fill="#FDE68A" style="animation-delay:1.7s"/>
    <circle class="twinkle" cx="1268" cy="358" r="2.6" fill="#C084FC" style="animation-delay:2s"/>
  </g>
</svg>
