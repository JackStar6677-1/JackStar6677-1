<svg width="1400" height="480" viewBox="0 0 1400 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JackStar profile banner</title>
  <desc id="desc">Animated obsidian, violet and gold systems banner for JackStar, showing production engineering, automation, infrastructure and live operations.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1400" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05010E"/>
      <stop offset="0.28" stop-color="#19092F"/>
      <stop offset="0.52" stop-color="#0B1235"/>
      <stop offset="0.74" stop-color="#261044"/>
      <stop offset="1" stop-color="#050817"/>
    </linearGradient>

    <radialGradient id="aurora" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 236) rotate(90) scale(330 720)">
      <stop stop-color="#FDE68A" stop-opacity="0.38"/>
      <stop offset="0.23" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="0.58" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#05010E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldLine" x1="150" y1="62" x2="1250" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7D6"/>
      <stop offset="0.34" stop-color="#D4A24A"/>
      <stop offset="0.68" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="panelStroke" x1="380" y1="114" x2="1020" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="panelFill" x1="422" y1="118" x2="978" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12051F" stop-opacity="0.94"/>
      <stop offset="0.54" stop-color="#111827" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0.9"/>
    </linearGradient>

    <pattern id="matrix" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
      <path d="M14 0V56M28 0V56M42 0V56M0 14H56M0 28H56M0 42H56" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <filter id="softBlur" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="panelShadow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.48"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#8B5CF6" flood-opacity="0.22"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-80%" width="140%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FDE68A" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#7C3AED" flood-opacity="0.34"/>
    </filter>

    <filter id="nodeGlow" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FDE68A" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#8B5CF6" flood-opacity="0.28"/>
    </filter>

    <style>
      .mono { font-family: "Fira Code", "Cascadia Code", Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .orbitA { transform-origin: 700px 240px; animation: spin 52s linear infinite; }
      .orbitB { transform-origin: 700px 240px; animation: spinBack 74s linear infinite; }
      .orbitC { transform-origin: 700px 240px; animation: spin 110s linear infinite; }
      .dashFast { stroke-dasharray: 18 22; animation: dash 11s linear infinite; }
      .dashSlow { stroke-dasharray: 3 18; animation: dashBack 18s linear infinite; }
      .float { animation: float 5.6s ease-in-out infinite; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      .spark { animation: spark 2.8s ease-in-out infinite; }
      .scan { animation: scan 6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinBack { to { transform: rotate(-360deg); } }
      @keyframes dash { to { stroke-dashoffset: -120; } }
      @keyframes dashBack { to { stroke-dashoffset: 90; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes spark { 0%,100% { opacity: .25; } 45%,60% { opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateX(-170px); opacity: 0; } 15%,75% { opacity: .75; } 50% { transform: translateX(170px); } }
    </style>
  </defs>

  <rect width="1400" height="480" rx="40" fill="url(#space)"/>
  <rect x="26" y="24" width="1348" height="432" rx="30" fill="url(#matrix)"/>
  <ellipse cx="700" cy="236" rx="610" ry="260" fill="url(#aurora)" filter="url(#softBlur)"/>
  <path d="M78 395C252 320 362 362 520 280C712 181 842 100 1040 152C1152 182 1226 247 1320 210" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="34" filter="url(#softBlur)"/>
  <path d="M94 90C244 166 382 106 546 184C730 272 856 408 1068 338C1178 302 1240 326 1304 384" stroke="#D4A24A" stroke-opacity="0.12" stroke-width="28" filter="url(#softBlur)"/>

  <g opacity="0.45">
    <path d="M118 96H1282" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M118 384H1282" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M160 64V416M1240 64V416" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>

  <g class="orbitC" opacity="0.42">
    <ellipse cx="700" cy="240" rx="622" ry="178" stroke="#A5B4FC" stroke-width="1.2" class="dashSlow"/>
    <ellipse cx="700" cy="240" rx="622" ry="178" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="8"/>
  </g>
  <g class="orbitB" opacity="0.72">
    <ellipse cx="700" cy="240" rx="520" ry="136" stroke="url(#goldLine)" stroke-width="1.8" class="dashFast"/>
    <circle class="pulse" cx="1220" cy="240" r="5.5" fill="#FDE68A" filter="url(#nodeGlow)"/>
    <circle cx="180" cy="240" r="4.2" fill="#A78BFA" filter="url(#nodeGlow)"/>
  </g>
  <g class="orbitA" opacity="0.86">
    <ellipse cx="700" cy="240" rx="382" ry="104" stroke="#D4A24A" stroke-width="1.5" stroke-opacity="0.9"/>
    <circle class="pulse" cx="1082" cy="240" r="5.5" fill="#67E8F9" filter="url(#nodeGlow)"/>
    <circle cx="318" cy="240" r="4.5" fill="#FDE68A" filter="url(#nodeGlow)"/>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="402" y="128" width="596" height="214" rx="28" fill="url(#panelFill)" stroke="url(#panelStroke)" stroke-width="1.5"/>
    <rect x="420" y="146" width="560" height="178" rx="20" fill="#050817" fill-opacity="0.32" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path class="scan" d="M700 146V324" stroke="#FDE68A" stroke-opacity="0.38" stroke-width="2"/>
  </g>

  <g text-anchor="middle" filter="url(#textGlow)">
    <text class="sans" x="700" y="210" fill="#FFF7D6" font-size="86" font-weight="900" letter-spacing="0">JackStar</text>
    <text class="mono" x="700" y="252" fill="#FDE68A" font-size="18" font-weight="800">production systems that survive contact with reality</text>
    <text class="mono" x="700" y="284" fill="#D8B4FE" font-size="15" font-weight="700">Java · Linux · automation · infrastructure · live operations</text>
  </g>

  <g class="float">
    <g transform="translate(150 156)" filter="url(#nodeGlow)">
      <rect x="-70" y="-24" width="140" height="48" rx="16" fill="#0B1235" fill-opacity="0.9" stroke="#93C5FD" stroke-width="1.2"/>
      <text class="mono" text-anchor="middle" y="-3" fill="#DBEAFE" font-size="12" font-weight="800">Automation</text>
      <text class="mono" text-anchor="middle" y="15" fill="#93C5FD" font-size="10">agents + recovery</text>
    </g>
    <g transform="translate(1244 158)" filter="url(#nodeGlow)">
      <rect x="-78" y="-24" width="156" height="48" rx="16" fill="#1E102F" fill-opacity="0.9" stroke="#C084FC" stroke-width="1.2"/>
      <text class="mono" text-anchor="middle" y="-3" fill="#F5D0FE" font-size="12" font-weight="800">DrakesCraft</text>
      <text class="mono" text-anchor="middle" y="15" fill="#C084FC" font-size="10">network + ecosystem</text>
    </g>
    <g transform="translate(210 330)" filter="url(#nodeGlow)">
      <rect x="-82" y="-24" width="164" height="48" rx="16" fill="#06281E" fill-opacity="0.9" stroke="#6EE7B7" stroke-width="1.2"/>
      <text class="mono" text-anchor="middle" y="-3" fill="#D1FAE5" font-size="12" font-weight="800">Education</text>
      <text class="mono" text-anchor="middle" y="15" fill="#6EE7B7" font-size="10">labs + operations</text>
    </g>
    <g transform="translate(1198 328)" filter="url(#nodeGlow)">
      <rect x="-82" y="-24" width="164" height="48" rx="16" fill="#29140B" fill-opacity="0.9" stroke="#FDBA74" stroke-width="1.2"/>
      <text class="mono" text-anchor="middle" y="-3" fill="#FFEDD5" font-size="12" font-weight="800">Systems Lab</text>
      <text class="mono" text-anchor="middle" y="15" fill="#FDBA74" font-size="10">Rust + Java + tools</text>
    </g>
  </g>

  <g opacity="0.72">
    <path d="M220 132L292 96L362 128L442 96" stroke="#A78BFA" stroke-opacity="0.5"/>
    <path d="M944 360L1030 306L1128 328L1194 286" stroke="#D4A24A" stroke-opacity="0.52"/>
    <circle class="spark" cx="220" cy="132" r="3" fill="#FDE68A"/>
    <circle class="spark" cx="292" cy="96" r="3.4" fill="#C084FC" style="animation-delay:.3s"/>
    <circle class="spark" cx="362" cy="128" r="3" fill="#FDE68A" style="animation-delay:.65s"/>
    <circle class="spark" cx="442" cy="96" r="3.2" fill="#67E8F9" style="animation-delay:1s"/>
    <circle class="spark" cx="1030" cy="306" r="3.4" fill="#FDE68A" style="animation-delay:.45s"/>
    <circle class="spark" cx="1128" cy="328" r="3" fill="#C084FC" style="animation-delay:.85s"/>
    <circle class="spark" cx="1194" cy="286" r="3.4" fill="#67E8F9" style="animation-delay:1.25s"/>
  </g>

  <g opacity="0.9">
    <circle class="spark" cx="526" cy="82" r="2.6" fill="#FDE68A"/>
    <circle class="spark" cx="878" cy="94" r="2.8" fill="#C084FC" style="animation-delay:.35s"/>
    <circle class="spark" cx="1068" cy="206" r="2.8" fill="#67E8F9" style="animation-delay:.7s"/>
    <circle class="spark" cx="296" cy="260" r="2.4" fill="#C084FC" style="animation-delay:1.1s"/>
    <circle class="spark" cx="776" cy="366" r="3" fill="#FDE68A" style="animation-delay:1.5s"/>
    <circle class="spark" cx="1274" cy="386" r="2.4" fill="#67E8F9" style="animation-delay:1.9s"/>
    <circle class="spark" cx="116" cy="396" r="2.3" fill="#FDE68A" style="animation-delay:2.2s"/>
    <circle class="spark" cx="1310" cy="104" r="2.5" fill="#C084FC" style="animation-delay:2.45s"/>
  </g>
</svg>
